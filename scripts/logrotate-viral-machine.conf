# Aturan pemangkasan log mesin produksi MesinViral v2.
#
# ═══════════════════════════════════════════════════════════════════════════════════════════════
# KENAPA BERKAS INI ADA DI REPO (bukan hanya di server) — 2026-08-13
#
# Aturan sebelumnya HANYA hidup di `/etc/logrotate.d/viral-machine` pada server, ditulis 24-April
# di masa v1. Pindahan ke v2 terjadi 17-Juni; aturannya tertinggal menunjuk folder lama. Selama
# DUA BULAN ia melapor setiap hari:
#     "log /home/rad4vm/viral-machine/logs/*.log does not exist -- skipping"
# dan tak seorang pun mendengar — folder itu memang sudah tidak ada. Akibatnya `worker.log`
# tumbuh tanpa henti sampai 48 MB, 44% isinya baris berulang yang sama, dan setiap diagnosa
# harus mengaduknya.
#
# Karena berkas setelan itu ada DI LUAR repo, tak ada yang memversikannya, tak ada yang
# memeriksanya, dan tak ada yang tahu ketika ia melenceng. Menaruhnya di sini + dipasang oleh
# `deploy_be.sh` membuat kesalahan yang sama TIDAK BISA lagi bersembunyi: ia ikut terkirim setiap
# deploy, selamat dari pembangunan ulang server, dan riwayat perubahannya tercatat.
#
# ⚠️ DUA HAL YANG TERBUKTI LEWAT JALAN-KERING, JANGAN DIUBAH TANPA MENGUJI ULANG:
#
#   `su root root`  — TANPA baris ini logrotate MENOLAK bekerja:
#       "parent directory has insecure permissions ... Set su directive"
#     Sebabnya folder induk milik `rad4vm` sementara berkas lognya milik `root` (systemd membuka
#     berkas sebagai root lalu menyerahkan fd-nya ke proses yang berjalan sebagai rad4vm).
#     Usulan pertama tanpa baris ini AKAN GAGAL DIAM-DIAM — persis penyakit yang sedang diobati.
#
#   `copytruncate`  — WAJIB. systemd memegang berkas ini terus lewat `StandardOutput=append:`;
#     ia tidak membuka ulang berkas saat diputar. Tanpa copytruncate, log baru akan menulis ke
#     berkas yang sudah dipindah namanya → berkas aktif tampak kosong selamanya.
# ═══════════════════════════════════════════════════════════════════════════════════════════════

/home/rad4vm/viral-machine-v2/worker.log {
    su root root
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
